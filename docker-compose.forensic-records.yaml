services:
  forensic-postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: localrecall
      POSTGRES_USER: localrecall
      POSTGRES_PASSWORD: localrecall
    ports:
      - "5433:5432"
    volumes:
      - forensic_postgres_data:/var/lib/postgresql/data
      - ./db/forensic_records:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localrecall -d localrecall"]
      interval: 10s
      timeout: 5s
      retries: 10

  forensic-nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - forensic_nats_data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  forensic-spool-init:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /data/forensic/spool && chown -R 65532:65532 /data/forensic/spool && chmod 0750 /data/forensic/spool"]
    volumes:
      - forensic_spool:/data/forensic/spool

  forensic-records-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/forensic_records/Dockerfile
    user: "65532:65532"
    environment:
      FORENSIC_API_ADDR: ":8091"
      FORENSIC_SPOOL_DIR: /data/forensic/spool
      FORENSIC_KB_MIRROR_ENABLED: "true"
      LOCALAI_KB_URL: http://host.docker.internal:8080
      LOCALAI_API_KEY: ${LOCALAI_API_KEY:-}
      # qwen3-4b-instruct-2507-q4km-nxb21d-dev (Q4_K_M, 2.49GB) replaces the
      # Q8_0 build (4.28GB) as the default: live-benchmarked head-to-head with
      # the same JSON-schema narration payload, Q8_0 did not finish generating
      # a 250-token response within 240s while Q4_K_M finished in ~72s. Same
      # model family/tokenizer/prompt template as the Q8_0 build already
      # validated across the narration test suite, so this is a quantization
      # change only, not a model swap.
      FORENSIC_SYNTHESIS_MODEL: ${FORENSIC_SYNTHESIS_MODEL:-qwen3-4b-instruct-2507-q4km-nxb21d-dev}
      FORENSIC_SYNTHESIS_TIMEOUT: ${FORENSIC_SYNTHESIS_TIMEOUT:-120s}
      FORENSIC_DEFAULT_JURISDICTION: ${FORENSIC_DEFAULT_JURISDICTION:-PK}
      FORENSIC_DEFAULT_SOURCE_TIMEZONE: ${FORENSIC_DEFAULT_SOURCE_TIMEZONE:-Asia/Karachi}
      # Both default to fail-CLOSED: if FORENSIC_RECORDS_API_KEY isn't
      # exported (e.g. from .env.forensic-runtime.local), the container
      # refuses to start (validateForensicAuthConfig in auth_scope.go exits
      # 1) rather than silently serving the forensic API without
      # authentication, which happened live during this project's own
      # development when the vars weren't exported before `docker compose up`.
      # Model-assisted plan generation. The fallback is OFF by default because
      # field selection was measured unstable; shadow mode records what the
      # generator WOULD have produced without ever using it, for golden-IR
      # measurement.
      FORENSIC_IR_FALLBACK: ${FORENSIC_IR_FALLBACK:-false}
      FORENSIC_IR_ARBITRATION: ${FORENSIC_IR_ARBITRATION:-false}
      FORENSIC_IR_CROSSCHECK: ${FORENSIC_IR_CROSSCHECK:-false}
      FORENSIC_VERIFIED_ONLY: ${FORENSIC_VERIFIED_ONLY:-false}
      FORENSIC_IR_SHADOW: ${FORENSIC_IR_SHADOW:-false}
      # Removes filters whose values the analyst never supplied, instead of
      # refusing the whole plan over them. WIDENS a result, so it is opt-in and
      # measured on its own: the generator bolts invented filters
      # (`cdr.direction = "outbound"`, `tower.site_location CONTAINS "where"`)
      # onto otherwise-correct plans, and the correct filter was being thrown
      # away alongside the invention.
      FORENSIC_DROP_INVENTED_FILTERS: ${FORENSIC_DROP_INVENTED_FILTERS:-false}
      # The keyword routing ladder, P3's remaining deliverable. DEFAULT ON,
      # unlike every other switch here: the others gate NEW capabilities so
      # off-by-default means "no change", while this gates an EXISTING
      # behaviour and default-off would silently reroute every question.
      # Set to false to measure the corpus with the compiler deciding alone.
      FORENSIC_LADDER_ROUTING: ${FORENSIC_LADDER_ROUTING:-true}
      # The `breakdown` goal, slice 1 of the taxonomy fix. The goal taxonomy has
      # no breakdown, so an explicit breakdown question lands on the `lookup`
      # DEFAULT, which means "unrecognised" and skips shape verification. WI-31
      # tried mapping it onto `aggregate` and ACC-02 answered a 1,000-row total
      # to a breakdown question, because `aggregate` with no group hints asserts
      # shape `scalar`. This goal's shape carries a GROUPING OBLIGATION instead,
      # so an ungrouped plan is refused rather than presented as one number.
      # Threshold: reports/breakdown-taxonomy-20260925/BREAKDOWN_GOAL_RULE.md
      FORENSIC_BREAKDOWN_GOAL: ${FORENSIC_BREAKDOWN_GOAL:-false}
      # THE STATED ANSWER MUST CONTAIN THE ANSWER. The Phase 1 gate requires the
      # answer in the analyst text, and EIGHT of the 62 failed it while scoring
      # CORRECT because the harness graded the whole response instead. A range
      # answered "1 CDR record matched this question"; a six-value breakdown
      # stated three. Values are in data_grid either way -- the defect is that
      # the DIRECT ANSWER does not answer.
      # Threshold: reports/answer-not-stated-20260925/ANSWER_NOT_STATED.md
      FORENSIC_ANSWER_STATES_VALUES: ${FORENSIC_ANSWER_STATES_VALUES:-false}
      # MEDIA BECOMES ALGEBRA. Lets a typed plan read forensic.derived_artifacts
      # -- OCR lines, plate reads, face detections, transcript segments -- so
      # media questions stop depending on hand-written templates. Aggregates
      # only: listing individual derived rows is refused until their provenance
      # is mapped, because derived_artifacts has no record_id or row_hash.
      #
      # A DERIVED OBSERVATION IS NOT A SOURCE RECORD. A model's plate read is
      # not a camera's sighting, and the citation carries source_truth_state so
      # the two can never be presented as one. A plan that mixes the two tables
      # is REFUSED, never joined.
      # Evidence: reports/stage1-20260926/SOURCE_CONTRACT.md
      FORENSIC_DERIVED_ARTIFACT_EXECUTION: ${FORENSIC_DERIVED_ARTIFACT_EXECUTION:-false}
      # AN AVERAGE MUST SAY WHAT IT AVERAGED OVER. image-ocr carries three
      # confidence fields from two disjoint producers: 263 of 309 rows, and 46
      # each. "The average OCR confidence is 0.87" reads as a statement about all
      # 309 and is a statement about 85% of them. This is the beam-width defect
      # with the field choice already fixed -- a correct AVG over a population
      # the analyst was never told about. Selects COUNT(field) alongside the
      # measure and qualifies the answer below 95% coverage.
      FORENSIC_MEASURE_DENOMINATOR: ${FORENSIC_MEASURE_DENOMINATOR:-false}
      # A MEDIA QUESTION MUST BE ABLE TO NAME A MEDIA FAMILY. Measured live:
      # ZERO of 28 media questions reached a typed plan, because family
      # resolution goes through the STRUCTURED record types only -- "how many
      # plate groups used persistent tracking" resolved anpr_vehicles and
      # answered "1,057 ANPR sightings". This asks the CURATED LAYER instead,
      # using the same phrase matcher that binds curated values, so widening
      # coverage is a synonym in a YAML file and not a code change.
      #
      # NOT READY TO ENABLE. Four ACCEPTED routings collide with media synonyms
      # ("image ocr" vs the image_ocr_search template, "face candidate" vs
      # face_candidate_observations). TestMediaFamilyRoutingNeverClaimsAnAccepted-
      # VariantRouting fails until curation separates retrieval from algebra.
      FORENSIC_MEDIA_FAMILY_ROUTING: ${FORENSIC_MEDIA_FAMILY_ROUTING:-false}
      # BOOLEAN RESTRICTION OBLIGATION. Refuses a plan that neither filters nor
      # groups on a curated BOOLEAN field the question named, instead of
      # answering the unrestricted count.
      #
      # Measured live, Step 4, 2026-09-26: "how many image text regions require
      # manual review" answered 309 where the truth is 46, and "how many plate
      # groups used persistent object tracking" answered 24 where the truth is
      # 0. Both plans carried `filters: null`, both bound to the RIGHT table,
      # and both verified -- verification proves a plan against ITSELF, never
      # against the question. An INVENTED filter is a symptom this system
      # already watches for; a MISSING one has none.
      #
      # It must be DECLARED here even while it defaults false: compose only
      # passes variables it names, so a switch set in the shell but missing from
      # this file never reaches the container and the arm silently measures the
      # feature OFF. That is the 2026-09-25 configuration drift exactly, and it
      # was caught here by asserting the container env before scoring.
      FORENSIC_BOOLEAN_RESTRICTION: ${FORENSIC_BOOLEAN_RESTRICTION:-false}
      # UNTARGETED TEXT BROWSE GUARD. **DEFAULTS ON** -- note the `:-true`.
      #
      # `derivedTextRelevance` returns "relevant" for every passage when a
      # question names no identifier and no content term ("nothing to filter
      # on: a browse request"), so an untargeted question returns every
      # transcript and every OCR passage IN FULL. Those are the five curated
      # fields marked PII that CatalogFields withholds from every typed plan:
      # the compiler cannot name them, and the ladder reads them straight out
      # of the JSON.
      #
      # Measured 2026-09-26: "What does the audio transcript say?" returned the
      # actual Urdu transcript in the analyst answer. Search WITH a term is not
      # the defect and is untouched -- AUD-01/02/03, DOC-02/03 and IMG-01 are
      # CORRECT in the golden 62 and their snippet IS the citation.
      #
      # Default-ON because default-off would ship the bulk-PII path. The switch
      # exists to take a CONTROL measurement, not to omit the guard.
      FORENSIC_TEXT_BROWSE_GUARD: ${FORENSIC_TEXT_BROWSE_GUARD:-true}
      # Memoizes the plan completion on a hash of the exact model payload.
      # Sound because the completion is requested at temperature 0, so it is a
      # deterministic function of that payload; the cached bytes re-enter the
      # same decode and re-verification path, so the cache removes an HTTP call
      # and never a check. Measured 2026-09-24: 45% of questions generate a plan
      # at a median of 138 s.
      FORENSIC_PLAN_CACHE: ${FORENSIC_PLAN_CACHE:-false}
      # Persisting the cache makes the latency property survive a redeploy
      # instead of being re-earned after it. OPT-IN and empty by default: each
      # file holds one model completion, and a plan can carry the question's
      # literal values (a plan for "how many calls did 03001234567 make" holds
      # that number as a filter). That is not evidence, and the same plan is
      # already in the response audit of every request that used it -- but
      # writing it to a volume is a different act, so an operator enables it
      # deliberately or nothing is written at all.
      FORENSIC_PLAN_CACHE_DIR: ${FORENSIC_PLAN_CACHE_DIR:-}
      FORENSIC_API_KEY: ${FORENSIC_RECORDS_API_KEY:-}
      FORENSIC_API_AUTH_REQUIRED: ${FORENSIC_API_AUTH_REQUIRED:-true}
      FORENSIC_TRUSTED_TENANT_ID: ${FORENSIC_RECORDS_TENANT_ID:-default}
      FORENSIC_DATABASE_URL: postgresql://localrecall:localrecall@forensic-postgres:5432/localrecall
      NATS_URL: nats://forensic-nats:4222
    ports:
      - "8091:8091"
    volumes:
      - forensic_spool:/data/forensic/spool
    depends_on:
      forensic-spool-init:
        condition: service_completed_successfully
      forensic-postgres:
        condition: service_healthy
      forensic-nats:
        condition: service_healthy

  forensic-records-worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ingestion/forensic_records/Dockerfile
    environment:
      FORENSIC_DATABASE_URL: postgresql://localrecall:localrecall@forensic-postgres:5432/localrecall
      NATS_URL: nats://forensic-nats:4222
      NATS_RECORDS_SUBJECT: forensic.records.ingest.requested
      NATS_RECORDS_DLQ_SUBJECT: forensic.records.ingest.dead_letter
      NATS_RECORDS_STREAM: FORENSIC_RECORDS_INGEST
      NATS_RECORDS_DLQ_STREAM: FORENSIC_RECORDS_DLQ
      NATS_RECORDS_CONSUMER: forensic-records-worker-v1
      NATS_RECORDS_QUEUE_GROUP: forensic-records-worker-v1
      FORENSIC_WORKER_LEASE_SECONDS: "600"
      FORENSIC_WORKER_MAX_INFLIGHT: "1"
      FORENSIC_SPOOL_DIR: /data/forensic/spool
      FORENSIC_WORKER_METRICS_PORT: "9109"
      FORENSIC_DEFAULT_SOURCE_TIMEZONE: ${FORENSIC_DEFAULT_SOURCE_TIMEZONE:-Asia/Karachi}
      FORENSIC_ANPR_ENABLED: ${FORENSIC_ANPR_ENABLED:-false}
      FORENSIC_ANPR_DETECTOR_MODEL_PATH: /models/media/open-image-models/yolo-v9-t-384-license-plate-end2end/yolo-v9-t-384-license-plates-end2end.onnx
      FORENSIC_ANPR_OCR_MODEL_PATH: /models/media/fast-plate-ocr/cct-xs-v2-global-model/cct_xs_v2_global.onnx
      FORENSIC_ANPR_OCR_CONFIG_PATH: /models/media/fast-plate-ocr/cct-xs-v2-global-model/cct_xs_v2_global_plate_config.yaml
      FORENSIC_ANPR_ONNX_PROVIDERS: ${FORENSIC_ANPR_ONNX_PROVIDERS:-OpenVINOExecutionProvider,CPUExecutionProvider}
      FORENSIC_ANPR_MIN_DETECTION_CONFIDENCE: ${FORENSIC_ANPR_MIN_DETECTION_CONFIDENCE:-0.75}
      FORENSIC_FACE_ENABLED: ${FORENSIC_FACE_ENABLED:-false}
      FORENSIC_FACE_ENDPOINT: ${FORENSIC_FACE_ENDPOINT:-http://api:8080/v1/face}
      FORENSIC_FACE_MODEL: ${FORENSIC_FACE_MODEL:-face-detect-yunet-sface}
      FORENSIC_FACE_MODEL_SHA256: ${FORENSIC_FACE_MODEL_SHA256:-9ce78d4ba0ae9d5e8c91a0e145d511558d1d90f5d9c1f4131cca9bb4bce60902}
      FORENSIC_FACE_BACKEND_DIGEST: ${FORENSIC_FACE_BACKEND_DIGEST:-sha256:8d303ecedb5e6f4dd2c5a0023da806ac3f8ceef369ff83628f24d99d1a0f3f19}
      FORENSIC_FACE_MAX_INPUT_BYTES: ${FORENSIC_FACE_MAX_INPUT_BYTES:-16777216}
      FORENSIC_FACE_MAX_OBSERVATIONS: ${FORENSIC_FACE_MAX_OBSERVATIONS:-32}
      FORENSIC_FACE_TIMEOUT_SECONDS: ${FORENSIC_FACE_TIMEOUT_SECONDS:-180}
      FORENSIC_IMAGE_EMBEDDING_ENABLED: ${FORENSIC_IMAGE_EMBEDDING_ENABLED:-false}
      FORENSIC_IMAGE_EMBEDDING_MODEL: ${FORENSIC_IMAGE_EMBEDDING_MODEL:-google/siglip-base-patch16-224}
      FORENSIC_IMAGE_EMBEDDING_MODEL_PATH: ${FORENSIC_IMAGE_EMBEDDING_MODEL_PATH:-/models/media/nexusai/models/google-siglip-base-patch16-224/7fd15f0689c79d79e38b1c2e2e2370a7bf2761ed}
      FORENSIC_IMAGE_EMBEDDING_MODEL_REVISION: ${FORENSIC_IMAGE_EMBEDDING_MODEL_REVISION:-7fd15f0689c79d79e38b1c2e2e2370a7bf2761ed}
      FORENSIC_IMAGE_EMBEDDING_MODEL_SHA256: ${FORENSIC_IMAGE_EMBEDDING_MODEL_SHA256:-2c63cb7d1f2e95ba501893cbb8faeb4ea9a3af295498d35097126228659c2af8}
      FORENSIC_IMAGE_EMBEDDING_MAX_INPUT_BYTES: ${FORENSIC_IMAGE_EMBEDDING_MAX_INPUT_BYTES:-16777216}
      FORENSIC_IMAGE_EMBEDDING_CPU_THREADS: ${FORENSIC_IMAGE_EMBEDDING_CPU_THREADS:-1}
      FORENSIC_OCR_ENABLED: ${FORENSIC_OCR_ENABLED:-false}
      FORENSIC_OCR_BACKEND: ${FORENSIC_OCR_BACKEND:-tesseract}
      FORENSIC_PADDLE_DETECTOR_MODEL_DIR: ${FORENSIC_PADDLE_DETECTOR_MODEL_DIR:-/models/media/paddleocr/PP-OCRv5_mobile_det}
      FORENSIC_PADDLE_ENGLISH_MODEL_DIR: ${FORENSIC_PADDLE_ENGLISH_MODEL_DIR:-/models/media/paddleocr/en_PP-OCRv5_mobile_rec}
      FORENSIC_PADDLE_ARABIC_MODEL_DIR: ${FORENSIC_PADDLE_ARABIC_MODEL_DIR:-/models/media/paddleocr/arabic_PP-OCRv5_mobile_rec}
      FORENSIC_PADDLE_DETECTOR_TREE_SHA256: ${FORENSIC_PADDLE_DETECTOR_TREE_SHA256:-1771a1ca1af2b1625228d2349849be1ccba507af13753547969c1de1702bdd74}
      FORENSIC_PADDLE_ENGLISH_TREE_SHA256: ${FORENSIC_PADDLE_ENGLISH_TREE_SHA256:-9580601f0a93d061d89cd89676be65353a8e81ac760063f5c22788f4fe5673a9}
      FORENSIC_PADDLE_ARABIC_MULTILINGUAL_TREE_SHA256: ${FORENSIC_PADDLE_ARABIC_MULTILINGUAL_TREE_SHA256:-3ee6f2267929b0fae36a6c63565f70f506ced8e133e9e2ed626a89c131d4cd1f}
      FORENSIC_OCR_TESSERACT_PATH: ${FORENSIC_OCR_TESSERACT_PATH:-/usr/bin/tesseract}
      FORENSIC_OCR_TESSDATA_PATH: ${FORENSIC_OCR_TESSDATA_PATH:-/models/media/nexusai/models/tessdata-fast/65727574dfcd264acbb0c3e07860e4e9e9b22185}
      FORENSIC_OCR_TESSDATA_REVISION: ${FORENSIC_OCR_TESSDATA_REVISION:-65727574dfcd264acbb0c3e07860e4e9e9b22185}
      FORENSIC_OCR_ENG_SHA256: ${FORENSIC_OCR_ENG_SHA256:-7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2}
      FORENSIC_OCR_URD_SHA256: ${FORENSIC_OCR_URD_SHA256:-62e8250ce2a994106e313a82e26a516a39e2cf159d0ce3c5b5008387fd0d555f}
      FORENSIC_OCR_LANGUAGES: ${FORENSIC_OCR_LANGUAGES:-eng+urd}
      FORENSIC_OCR_MAX_INPUT_BYTES: ${FORENSIC_OCR_MAX_INPUT_BYTES:-16777216}
      FORENSIC_OCR_MAX_OUTPUT_BYTES: ${FORENSIC_OCR_MAX_OUTPUT_BYTES:-4194304}
      FORENSIC_OCR_MAX_OBSERVATIONS: ${FORENSIC_OCR_MAX_OBSERVATIONS:-256}
      FORENSIC_OCR_TIMEOUT_SECONDS: ${FORENSIC_OCR_TIMEOUT_SECONDS:-60}
      FORENSIC_OCR_PSM: ${FORENSIC_OCR_PSM:-11}
      FORENSIC_VIDEO_MAX_SAMPLE_FRAMES: ${FORENSIC_VIDEO_MAX_SAMPLE_FRAMES:-6}
      FORENSIC_VIDEO_SAMPLE_INTERVAL_SECONDS: ${FORENSIC_VIDEO_SAMPLE_INTERVAL_SECONDS:-5}
      FORENSIC_VIDEO_ANPR_V2_ENABLED: ${FORENSIC_VIDEO_ANPR_V2_ENABLED:-false}
      FORENSIC_VIDEO_ANPR_PLATE_DETECTOR_PATH: ${FORENSIC_VIDEO_ANPR_PLATE_DETECTOR_PATH:-/models/media/video-anpr-v2/license_plate_detector.pt}
      FORENSIC_VIDEO_ANPR_VEHICLE_DETECTOR_PATH: ${FORENSIC_VIDEO_ANPR_VEHICLE_DETECTOR_PATH:-/models/media/video-anpr-v2/yolov8n.pt}
      FORENSIC_VIDEO_ANPR_V2_MAX_FRAMES: ${FORENSIC_VIDEO_ANPR_V2_MAX_FRAMES:-300}
      FORENSIC_VIDEO_ANPR_V2_MAX_DURATION_SECONDS: ${FORENSIC_VIDEO_ANPR_V2_MAX_DURATION_SECONDS:-900}
      FORENSIC_VIDEO_ANPR_V3_ENABLED: ${FORENSIC_VIDEO_ANPR_V3_ENABLED:-false}
      FORENSIC_VIDEO_ANPR_V3_DETECTION_CONFIDENCE: ${FORENSIC_VIDEO_ANPR_V3_DETECTION_CONFIDENCE:-0.25}
      FORENSIC_VIDEO_ANPR_V3_MAX_FRAMES: ${FORENSIC_VIDEO_ANPR_V3_MAX_FRAMES:-1200}
      FORENSIC_VIDEO_ANPR_V3_MAX_DURATION_SECONDS: ${FORENSIC_VIDEO_ANPR_V3_MAX_DURATION_SECONDS:-900}
      FORENSIC_ASR_ENABLED: ${FORENSIC_ASR_ENABLED:-false}
      FORENSIC_ASR_ENDPOINT: ${FORENSIC_ASR_ENDPOINT:-http://api:8080/v1/audio/transcriptions}
      FORENSIC_ASR_MODEL: ${FORENSIC_ASR_MODEL:-}
      FORENSIC_ASR_MAX_INPUT_BYTES: ${FORENSIC_ASR_MAX_INPUT_BYTES:-67108864}
      FORENSIC_ASR_TIMEOUT_SECONDS: ${FORENSIC_ASR_TIMEOUT_SECONDS:-300}
    user: "65532:65532"
    ports:
      - "9109:9109"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9109/metrics', timeout=3).read(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - forensic_spool:/data/forensic/spool:ro
      - ${NEXUSAI_MEDIA_MODEL_DIR:-./models/media}:/models/media:ro
    depends_on:
      forensic-spool-init:
        condition: service_completed_successfully
      forensic-postgres:
        condition: service_healthy
      forensic-nats:
        condition: service_healthy

volumes:
  forensic_postgres_data:
  forensic_nats_data:
  forensic_spool:
