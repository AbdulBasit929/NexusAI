# Media roles (docs/data/media-activation-programme-20261021.md and media-activation-results-20261021.md): which worker roles are on, with their pinned models.
# Add this file AFTER the main compose file and the Ingest v2 overlay, keep the project directory of the main checkout, and point the model folder at this checkout's models/media:
#
#   $env:NEXUSAI_MEDIA_MODEL_DIR = '<this checkout>\models\media'
#   docker compose --project-name nexusai --project-directory <main checkout> --env-file <main checkout>\.env.forensic-runtime.local `
#     -f <main checkout>\docker-compose.forensic-records.yaml -f <this checkout>\docker-compose.forensic-records.ingest-v2.yaml `
#     -f <this checkout>\docker-compose.forensic-records.media.yaml up -d --no-deps --no-build forensic-records-worker
#
# One role at a time (decision D25): a role is switched on here only after its gate passed in docs/data/media-activation-results-20261021.md; every switch is a default that an environment
# variable can override, and recreating the worker WITHOUT this file turns every media role off again (the safe direction). Models are pinned by SHA-256; the worker refuses one that differs.
# Provision the model folder with tools/media_data/provision_models.py (it prints the pins used below) and build the code with tools/media_data/Build-WorkerOverlay.ps1.
services:
  forensic-records-worker:
    environment:
      # D: documents and printed OCR. `auto` = script detection, Urdu data for Arabic-script pages, English data in document mode, ONNX PP-OCRv5 when the first reading is not confident.
      FORENSIC_OCR_ENABLED: ${FORENSIC_OCR_ENABLED:-true}
      FORENSIC_OCR_BACKEND: ${FORENSIC_OCR_BACKEND:-auto}
      FORENSIC_OCR_LANGUAGES: ${FORENSIC_OCR_LANGUAGES:-eng+urd}
      FORENSIC_OCR_TIMEOUT_SECONDS: ${FORENSIC_OCR_TIMEOUT_SECONDS:-120}
      FORENSIC_OCR_TESSDATA_PATH: ${FORENSIC_OCR_TESSDATA_PATH:-/models/media/nexusai/models/tessdata-best/e12c65a915945e4c28e237a9b52bc4a8f39a0cec}
      FORENSIC_OCR_TESSDATA_REVISION: ${FORENSIC_OCR_TESSDATA_REVISION:-e12c65a915945e4c28e237a9b52bc4a8f39a0cec}
      FORENSIC_OCR_ENG_SHA256: ${FORENSIC_OCR_ENG_SHA256:-8280aed0782fe27257a68ea10fe7ef324ca0f8d85bd2fd145d1c2b560bcb66ba}
      FORENSIC_OCR_URD_SHA256: ${FORENSIC_OCR_URD_SHA256:-65af3f6e50a3c3df15d7b405aab5d467e53433207745c8f5be5b8ff1a58a67c8}
      FORENSIC_OCR_ROUTER_CONFIDENT: ${FORENSIC_OCR_ROUTER_CONFIDENT:-0.75}
      FORENSIC_ONNX_OCR_DETECTOR_PATH: ${FORENSIC_ONNX_OCR_DETECTOR_PATH:-/models/media/onnx-ocr/PP-OCRv5_mobile_det/inference.onnx}
      FORENSIC_ONNX_OCR_DETECTOR_SHA256: ${FORENSIC_ONNX_OCR_DETECTOR_SHA256:-a431985659dc921974177a95adcfbb90fd9e51989a5e04d70d0b75f597b6e61d}
      FORENSIC_ONNX_OCR_LATIN_MODEL_PATH: ${FORENSIC_ONNX_OCR_LATIN_MODEL_PATH:-/models/media/onnx-ocr/latin_PP-OCRv5_mobile_rec/inference.onnx}
      FORENSIC_ONNX_OCR_LATIN_SHA256: ${FORENSIC_ONNX_OCR_LATIN_SHA256:-7888113072263cb471b93f66dd5e2ad70548dc526fa1ace760d0d973dd121498}
      FORENSIC_ONNX_OCR_THREADS: ${FORENSIC_ONNX_OCR_THREADS:-4}
      # script probe: the Arabic recogniser tells an Urdu page from a Latin one (its text is never stored); Tesseract's script pass was not reliable (docs/data/media-activation-results-20261021.md)
      FORENSIC_ONNX_OCR_SCRIPT_PROBE_MODEL_PATH: ${FORENSIC_ONNX_OCR_SCRIPT_PROBE_MODEL_PATH:-/models/media/onnx-ocr/arabic_PP-OCRv5_mobile_rec/inference.onnx}
      FORENSIC_ONNX_OCR_SCRIPT_PROBE_SHA256: ${FORENSIC_ONNX_OCR_SCRIPT_PROBE_SHA256:-799113ebf267fbe742deb99eb36e8d42c9ddc5291ceacf92add41b4d52a59110}
      FORENSIC_OCR_ROUTER_ARABIC_SHARE: ${FORENSIC_OCR_ROUTER_ARABIC_SHARE:-0.5}
      # A: speech to text through LocalAI (the container that answers the alias `api`; its model YAML /models/faster-whisper-turbo.yaml sets beam 1 and 8 threads, see tools/media_data/Install-AsrModel.ps1
      # and patch_faster_whisper_backend.py). Recordings longer than FORENSIC_ASR_LONG_AUDIO_SECONDS go to the small model so a long file cannot hold the service for hours (turbo runs at about 1.4 times real time).
      FORENSIC_ASR_ENABLED: ${FORENSIC_ASR_ENABLED:-true}
      FORENSIC_ASR_ENDPOINT: ${FORENSIC_ASR_ENDPOINT:-http://api:8088/v1/audio/transcriptions}
      FORENSIC_ASR_MODEL: ${FORENSIC_ASR_MODEL:-faster-whisper-turbo}
      FORENSIC_ASR_LONG_AUDIO_MODEL: ${FORENSIC_ASR_LONG_AUDIO_MODEL:-faster-whisper-small-ur}
      FORENSIC_ASR_LONG_AUDIO_SECONDS: ${FORENSIC_ASR_LONG_AUDIO_SECONDS:-600}
      FORENSIC_ASR_TIMEOUT_SECONDS: ${FORENSIC_ASR_TIMEOUT_SECONDS:-1800}
      # With no language given, the service called 7 of 24 Urdu clips Hindi and wrote Devanagari; when it hears Hindi the worker reads the recording again as Urdu and records that it did (set false for a deployment where Hindi speech is expected).
      FORENSIC_ASR_HINDI_AS_URDU: ${FORENSIC_ASR_HINDI_AS_URDU:-true}
