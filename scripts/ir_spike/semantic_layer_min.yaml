# Minimal curated semantic layer — WI-0 spike only.
#
# THROWAWAY. This is not the WI-4 deliverable and must not be loaded by production
# code. It exists to answer one question: can a 4B model fill an enum-constrained IR
# over a catalogue that has descriptions and synonyms? It is hand-curated from the
# real demo-case payloads (sampled read-only from forensic.records on 2026-09-21),
# not inferred from row samples at request time.
#
# Field IDs are readable and stable by deliberate choice (see PRE-REGISTRATION §2.3).
# `source_names` carries the real, messy, per-source-file column headers — this is the
# single largest piece of value the curated layer adds over the inferred catalogue,
# and SUB-02 (status vs account_status) proves it: the correct answer, 6, is only
# reachable by unioning two aliases.
#
# `allowed_filters` / `allowed_aggregates` mirror the live rules in
# source_native_algebra.go:306-317 so the spike's S6 validation is the real one.

contract_version: forensics.semantic-layer-spike/v0
case: nexusai-forensic-demo

entities:

  # ---------------------------------------------------------------- CDR
  - family: cdr
    display_name: Call detail records
    description: >
      One row per telephony event (voice call, SMS, data session) recorded by the
      network. 8,642 rows in this case, 2026-04-01 to 2026-08-10.
    synonyms: [cdr, cdrs, call record, call records, calls, call detail, telephony]
    fields:
      - id: cdr.msisdn
        display_name: Subscriber number
        description: >
          The MSISDN of the subscriber whose activity this record belongs to — the
          party who made or received the event. This is the field to filter on when
          asked what a given phone number did, and to group by when asked which
          phone number was most active.
        source_names: [MSISDN]
        synonyms: [phone number, number, msisdn, subscriber number, caller, who]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: IDENTIFIER

      - id: cdr.dialed_number
        display_name: Dialed number
        description: >
          The other party's number — the number that was dialed or that appears as
          the counterparty. Group by this to find who a subscriber contacted.
        source_names: [CALL_DIALED_NUM]
        synonyms: [dialed, called number, counterparty, contacted, other party, b party]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: IDENTIFIER

      - id: cdr.originating_number
        display_name: Originating number
        description: >
          The raw originating number field as supplied by the operator. Often a short
          code rather than a full MSISDN, so it is NOT the right field for "which
          number made the most calls" — use Subscriber number for that.
        source_names: [call_org_num]
        synonyms: [origin number, a party, originating]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: IDENTIFIER

      - id: cdr.call_type
        display_name: Call type
        description: >
          The kind of network event. Values in this case: VOICE, VOLTE, CALL, SMS,
          GPRS. Group by this for a "call type breakdown".
        source_names: [CALL_TYPE]
        synonyms: [call type, type, kind, breakdown by type, service type]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: NONE

      - id: cdr.direction
        display_name: Call direction
        description: >
          Whether the event was inbound or outbound. Values in this case are not
          normalised: INCOMING, INBOUND, OUTGOING, OUTBOUND, DATA. Group by this for
          "incoming versus outgoing".
        source_names: [INBOUND_OUTBOUND_IND]
        synonyms: [direction, incoming, outgoing, inbound, outbound, in or out]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: NONE

      - id: cdr.cell_site_id
        display_name: Cell site
        description: >
          Identifier of the cell site (tower sector) that handled the event. Group by
          this for "which cell site handled the most calls".
        source_names: [Cell_SITE_ID]
        synonyms: [cell site, cell, site, tower, cell tower, cell id, base station]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: NONE

      - id: cdr.imei
        display_name: Device IMEI
        description: Handset identifier associated with the event.
        source_names: [IMEI]
        synonyms: [imei, device, handset]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: IDENTIFIER

      - id: cdr.imsi
        display_name: SIM IMSI
        description: SIM identifier associated with the event.
        source_names: [IMSI]
        synonyms: [imsi, sim]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: IDENTIFIER

      - id: cdr.network_volume
        display_name: Network volume
        description: Data volume carried by the event, in operator-supplied units. Zero for voice and SMS.
        source_names: [Call_Network_Volume]
        synonyms: [volume, data volume, bytes, usage]
        type: NUMBER
        allowed_filters: [EQ, NEQ, GT, GTE, LT, LTE, BETWEEN, IN, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT, SUM, AVG, MIN, MAX]
        projectable: true
        groupable: false
        sortable: true
        sensitivity: NONE

      - id: cdr.call_start
        display_name: Call start time
        description: Timestamp at which the event began.
        source_names: [CALL_START_DT_TM]
        synonyms: [start, start time, began, call start]
        type: TIMESTAMP
        allowed_filters: [EQ, NEQ, GT, GTE, LT, LTE, BETWEEN, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT, MIN, MAX]
        projectable: true
        groupable: false
        sortable: true
        sensitivity: NONE

      - id: cdr.call_end
        display_name: Call end time
        description: Timestamp at which the event ended.
        source_names: [CALL_END_DT_TM]
        synonyms: [end, end time, finished, call end]
        type: TIMESTAMP
        allowed_filters: [EQ, NEQ, GT, GTE, LT, LTE, BETWEEN, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT, MIN, MAX]
        projectable: true
        groupable: false
        sortable: true
        sensitivity: NONE

      - id: cdr.event_time
        display_name: Event time
        description: >
          Normalised record timestamp used for all case-level time filtering and for
          "what date range do the records cover". Filter on this for month or period
          questions.
        source_names: [timestamp]
        synonyms: [date, time, when, period, date range, month, timestamp]
        type: TIMESTAMP
        allowed_filters: [EQ, NEQ, GT, GTE, LT, LTE, BETWEEN, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT, MIN, MAX]
        projectable: true
        groupable: false
        sortable: true
        sensitivity: NONE

      - id: cdr.source_file
        display_name: Source file
        description: >
          The evidence file each record was ingested from. Group by this for
          "how many records came from each source file".
        source_names: [source_file]
        synonyms: [source file, file, filename, evidence file, which file]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: NONE

