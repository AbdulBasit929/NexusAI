  # ---------------------------------------------------------------- Subscriber
  - family: subscriber
    display_name: Subscribers
    description: >
      One row per registered subscriber identity. 11 rows in this case, ingested from
      several source files with different column headers, so most fields have aliases.
    synonyms: [subscriber, subscribers, customer, customers, account holder, registered]
    fields:
      - id: subscriber.subscriber_id
        display_name: Subscriber ID
        description: Case-internal subscriber identifier, e.g. PK-SUB-SYN-ALPHA.
        source_names: [subscriber_id, customer_id, customer_no]
        synonyms: [subscriber id, customer id, id, account id]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: IDENTIFIER
      - id: subscriber.status
        display_name: Account status
        description: >
          Whether the subscriber account is ACTIVE, SUSPENDED or CLOSED. Stored under
          two different headers depending on the source file — both must be considered
          or the count is wrong.
        source_names: [status, account_status]
        synonyms: [status, active, state, account status, enabled]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: NONE
      - id: subscriber.full_name
        display_name: Subscriber name
        description: Registered name of the subscriber. Personal data.
        source_names: [full_name, customer_name, name, subscriber_name]
        synonyms: [name, full name, who, registered subscriber, customer name]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: PII
      - id: subscriber.cnic
        display_name: CNIC
        description: National identity number of the subscriber. Masked at projection.
        source_names: [cnic_no, CNIC, cnic, national_id]
        synonyms: [cnic, national id, identity number, nic]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: false
        sortable: false
        sensitivity: PII
      - id: subscriber.msisdn
        display_name: Subscriber number
        description: Phone number registered to the subscriber.
        source_names: [mobile_no, MSISDN, account_msisdn, phone_number, subscriber_number]
        synonyms: [phone number, msisdn, mobile, number, contact number]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: IDENTIFIER
      - id: subscriber.city
        display_name: City
        description: Registered city of the subscriber.
        source_names: [city, home_city, billing_region]
        synonyms: [city, town, region, location, where]
        type: STRING
        allowed_filters: [EQ, NEQ, IN, CONTAINS, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT]
        projectable: true
        groupable: true
        sortable: true
        sensitivity: NONE
      - id: subscriber.activation_date
        display_name: Activation date
        description: Date the subscriber account was activated.
        source_names: [activation_date, valid_from, created_at]
        synonyms: [activated, activation, start date, since]
        type: TIMESTAMP
        allowed_filters: [EQ, NEQ, GT, GTE, LT, LTE, BETWEEN, IS_NULL, IS_NOT_NULL]
        allowed_aggregates: [COUNT, MIN, MAX]
        projectable: true
        groupable: false
